[project]
name = "user-manual-reviewer"
version = "0.1.0"
description = "Desktop app that reviews related user manuals with rule checks and LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "PySide6>=6.8",
]

[project.scripts]
umr = "umr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: tests that need Qt",
    "eval: opt-in evaluation with real LLMs (run with -m eval)",
]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["umr"]
mypy_path = "src"
ignore_missing_imports = true
