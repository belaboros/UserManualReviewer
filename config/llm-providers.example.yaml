# Copy to config/llm-providers.yaml (git-ignored) and adjust.
# API keys are read from the environment variable named in api_key_env (or from .env next to the repo root
# or in the current folder). Never put a key in this file.
# Model names and prices are examples; check your provider's current values.
#
# Fields (all but name, adapter and model are optional):
#   adapter            anthropic | openai-compatible
#   base_url           endpoint of an OpenAI-compatible server (local servers need no api_key_env)
#   api_key_env        name of the environment variable holding the key
#   structured_output  json_schema | json_object | prompt   (default json_schema)
#   context_tokens     context budget; prompts above 70% of it are split per manual pair / manual / page group
#   max_output_tokens  default 16000
#   max_concurrency    parallel LLM checks for this provider (default 4)
#   temperature        default 0.0; null = do not send. The anthropic adapter sends it only when set here.
#   timeout_s          per request, default 300
#   price_per_mtok     USD per million tokens: input, output, cache_read, cache_write
#   extra              adapter options:
#                        openai-compatible: max_tokens_param (max_tokens | max_completion_tokens),
#                                           extra_body (dict sent with every request), max_retries
#                        anthropic:         effort (low | medium | high | xhigh | max), max_retries
providers:
  - name: claude-opus
    adapter: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    context_tokens: 1000000
    max_concurrency: 4
    price_per_mtok: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
    extra: { effort: medium }

  - name: claude-sonnet
    adapter: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    context_tokens: 1000000
    max_concurrency: 4
    price_per_mtok: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }

  - name: gpt
    adapter: openai-compatible
    base_url: https://api.openai.com/v1
    model: gpt-5
    api_key_env: OPENAI_API_KEY
    structured_output: json_schema
    temperature: null            # reasoning models accept only the default temperature
    extra: { max_tokens_param: max_completion_tokens }

  - name: gemini
    adapter: openai-compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-pro
    api_key_env: GEMINI_API_KEY
    structured_output: json_schema

  - name: local-ollama
    adapter: openai-compatible
    base_url: http://localhost:11434/v1
    model: qwen3:32b
    structured_output: json_object
    context_tokens: 32768
    max_concurrency: 1

  - name: local-lmstudio
    adapter: openai-compatible
    base_url: http://localhost:1234/v1
    model: local-model
    structured_output: json_schema
    context_tokens: 32768
    max_concurrency: 1
