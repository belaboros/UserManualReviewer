    severity: major
    title: 'No notification event for Out for delivery or Delivery failed'
    accept_categories: [contradiction, inconsistency]
    locations:
      - { page: delivery/dispatch.html, quote: "When the driver starts the route, the customer receives an" }
      - { page: delivery/dispatch.html, quote: "If nobody is at home, click Delivery failed" }
      - { page: notification/events.md, quote: "OrderDelivered The order status becomes Delivered Push order-delivered" }
