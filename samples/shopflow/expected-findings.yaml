      - { page: order-capturing/03-order-statuses.md, quote: "Confirmed Payment was received; the order is ready for the warehouse." }
      - { page: delivery/picking.html, quote: "Orders appear in the Picking queue once they have the status Paid" }
      - { page: delivery/statuses.html, quote: "Paid Payment received; waiting to be released to picking." }
  - id: C2
