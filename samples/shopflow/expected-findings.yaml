# Machine-readable answer key for the ShopFlow benchmark (ADR-0013, spec EVAL).
# Built from ANSWER_KEY.md: one entry per distinct planted problem (68). Entries marked
# "same as ..." there are merged into the entry they repeat. Never feed this file to a review.
#
# page    = "<manual_id>/<path relative to the manual folder>"
# quote   = verbatim readable text that umr.app.verify.locate_quote finds on that page
#           (image findings quote the image path, since the image has no readable text)
# tier    = rule: a deterministic check finds it; llm: only an LLM check can find it.
#           By default only tier "llm" entries are scored.
version: "1"
benchmark: shopflow
findings:
  # ---------- 1. Duplicate sections ----------
  - id: D1
    category: duplicate
    severity: minor
    title: '"Adding products to the cart" section duplicated'
    tier: rule
    locations:
