name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/traceability.py --check
